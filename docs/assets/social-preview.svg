<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AIWorkHub</title>
  <desc id="desc">Open-source control plane for multi-model AI coding agents. Task cards, independent review, Source Graph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#0b2630"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1090" cy="100" r="300" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="1180" cy="590" r="340" fill="#14b8a6" opacity="0.06"/>
  <g transform="translate(56 132) scale(1.5)" fill="none" stroke="url(#brand)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M128 34 73 69v44m55-79 55 35v44"/>
    <path d="m73 113-31 19v65l54 32 49-28m38-88 31 19v65l-54 32-53-31"/>
    <path d="M128 92v59m0 0-32-19-24 14v34l28 16m28-45 32-19 25 14v34l-25 16-32-19"/>
  </g>
  <g transform="translate(56 132) scale(1.5)" fill="#67e8f9">
    <circle cx="128" cy="34" r="12"/><circle cx="73" cy="113" r="12"/>
    <circle cx="183" cy="113" r="12"/><circle cx="42" cy="197" r="12"/>
    <circle cx="214" cy="197" r="12"/>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="452" y="262" fill="#f8fafc" font-size="128" font-weight="700" letter-spacing="-3">AIWorkHub</text>
    <g fill="#a5f3fc" font-size="44" font-weight="600">
      <text x="456" y="330">Open-source control plane for</text>
      <text x="456" y="384">multi-model AI coding agents</text>
    </g>
    <rect x="456" y="424" width="560" height="5" rx="2.5" fill="url(#brand)"/>
    <text x="456" y="482" fill="#cbd5e1" font-size="30" font-weight="600">Task cards <tspan fill="#38bdf8">&#183;</tspan> Independent review <tspan fill="#38bdf8">&#183;</tspan> Source Graph</text>
    <text x="101" y="584" fill="#cbd5e1" opacity="0.72" font-size="28" font-weight="500">github.com/shrec/AIWorkHub</text>
  </g>
</svg>
