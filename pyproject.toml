[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkhub"
version = "0.8.0"
description = "MCP server for AIWorkHub task queue orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AIWorkHub contributors" }]
keywords = [
  "ai-agents",
  "developer-tools",
  "mcp",
  "multi-agent",
  "orchestration",
  "source-graph",
  "vscode",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.0.0,<2"
]

[project.urls]
Homepage = "https://github.com/shrec/AIWorkHub"
Documentation = "https://github.com/shrec/AIWorkHub#readme"
Issues = "https://github.com/shrec/AIWorkHub/issues"
Changelog = "https://github.com/shrec/AIWorkHub/blob/main/CHANGELOG.md"
Source = "https://github.com/shrec/AIWorkHub"

[project.scripts]
aiworkhub = "aiworkhub.server:main"
awh = "aiworkhub.server:main"
aiworkhub-mcp = "aiworkhub.server:main"
aiworkhub-health = "aiworkhub.health:main"
aiworkhub-dashboard = "aiworkhub.dashboard:main"
aiworkhub-callback-bridge = "aiworkhub.callback_bridge:main"
aiworkhub-deepseek-credential = "aiworkhub.deepseek_credentials:main"
aiworkhub-app-server-mux = "aiworkhub.app_server_mux:main"
aiworkhub-reconciler = "aiworkhub.task_reconciler:main"
aiworkhub-callback-channel = "aiworkhub.callback_channel:main"

[tool.setuptools.package-data]
aiworkhub = ["dashboard_static/*", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
