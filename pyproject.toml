[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkhub"
dynamic = ["version"]
description = "Local-first, repository-native AI engineering control plane for VS Code and MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AIWorkHub contributors" }]
keywords = [
  "ai-agents",
  "developer-tools",
  "mcp",
  "multi-agent",
  "orchestration",
  "source-graph",
  "vscode",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.0.0,<2"
]

[project.optional-dependencies]
source-graph-semantic = [
  "tree-sitter-language-pack>=1.13,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  # NF-2026-00639: [tool.pytest.ini_options].addopts passes -n, so xdist is a
  # hard requirement of running this suite at all, not an optional speedup.
  "pytest-xdist>=3.5,<4",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/shrec/AIWorkHub"
Documentation = "https://github.com/shrec/AIWorkHub#readme"
Issues = "https://github.com/shrec/AIWorkHub/issues"
Changelog = "https://github.com/shrec/AIWorkHub/blob/main/CHANGELOG.md"
Source = "https://github.com/shrec/AIWorkHub"

[project.scripts]
aiworkhub = "aiworkhub.server:main"
awh = "aiworkhub.server:main"
aiworkhub-mcp = "aiworkhub.server:main"
aiworkhub-health = "aiworkhub.health:main"
aiworkhub-dashboard = "aiworkhub.dashboard:main"
aiworkhub-callback-bridge = "aiworkhub.callback_bridge:main"
aiworkhub-deepseek-credential = "aiworkhub.deepseek_credentials:main"
aiworkhub-app-server-mux = "aiworkhub.app_server_mux:main"
aiworkhub-reconciler = "aiworkhub.task_reconciler:main"
aiworkhub-callback-channel = "aiworkhub.callback_channel:main"
aiworkhub-build-hygiene = "aiworkhub.workspace_hygiene:main"

[tool.setuptools.package-data]
aiworkhub = ["dashboard_static/*", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "aiworkhub._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# NF-2026-00639: this suite was running single-threaded on a 16-core host at
# 0.34 of a core while pytest-xdist sat installed and unused. `-n auto` is
# resolved by pytest_xdist_auto_num_workers in tests/conftest.py, which derives
# the count from the observed core count and reserves headroom -- there is no
# pinned worker constant here or there.
# `--dist loadfile` keeps every test in a file on one worker, in file order.
# That is what makes the parallel run equivalent to the serial one for the
# tests in this repository that monkeypatch module-level state (module.os IS
# os) or drive daemons and child processes: those interfere across tests in the
# same file, which loadfile keeps together, not across files.
# Pass `-n 0` to run serially: for a single test the worker startup costs more
# than it saves, and it is the switch to reach for when isolating a failure.
# One file is measured to misbehave distributed -- tests/test_app_server_mux.py,
# whose sideband `ok: true` means delivered, not applied (2 failures in 8
# whole-file runs at -n auto, 0 in 10 serial runs including 5 under 14 CPU
# burners). CI runs it as its own serial pass. For a deterministic full run
# locally, do the same:
#   pytest tests/ --deselect tests/test_app_server_mux.py
#   pytest tests/test_app_server_mux.py -n 0
addopts = "-n auto --dist loadfile"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["eval", ".aiworkhub", "archive"]

[tool.ruff.lint]
# Start with correctness-critical rules that are green across the inherited
# tree. Broader style/import families are expanded only with a measured
# baseline so quality automation never lands as permanent CI noise.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
files = [
  "src/aiworkhub/_version.py",
  "src/aiworkhub/process_event_ledger.py",
  "src/aiworkhub/task_fsm.py",
  "src/aiworkhub/task_plan.py",
]
