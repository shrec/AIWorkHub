# Tag-driven AIWorkHub release - Python distributions and VSIX
# Marketplace and Open VSX publication are optional, gated on
# explicit repository secrets (OVSX_TOKEN / MARKETPLACE_TOKEN).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<x.y.z> tag to release"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  provenance:
    name: Verify exact-commit CI provenance
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      release_tag: ${{ steps.target.outputs.release_tag }}
    steps:
      - name: Check out requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Check out pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve immutable release target
        id: target
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "::error::release input must name an existing tag"
            exit 1
          }
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          checkout_commit="$(git rev-parse HEAD^{commit})"
          test "$tag_commit" = "$checkout_commit" || {
            echo "::error::tag commit does not match checked-out commit"
            exit 1
          }
          echo "release_sha=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Require successful push CI for exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        run: python scripts/check_release_ci_provenance.py --sha "$RELEASE_SHA"

  build:
    name: Build and smoke fresh release artifacts
    needs: [provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ needs.provenance.outputs.release_tag }}
        run: python scripts/release_metadata.py check --tag "$RELEASE_TAG"

      - name: Verify release assurance manifest
        run: python scripts/check_release_assurance.py

      - name: Verify replayable release evidence pack
        run: python scripts/check_release_evidence_pack.py

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build Python distributions
        run: python -m build --outdir dist

      - name: Verify Python distributions
        run: |
          shopt -s nullglob
          wheels=(dist/aiworkhub-*.whl)
          sdists=(dist/aiworkhub-*.tar.gz)
          (( ${#wheels[@]} == 1 ))
          (( ${#sdists[@]} == 1 ))
          test -s "${wheels[0]}"
          test -s "${sdists[0]}"
          python -m twine check dist/*

      - name: Smoke fresh installed Python artifacts
        run: |
          python -m venv /tmp/aiworkhub-release-smoke
          shopt -s nullglob
          wheels=(dist/aiworkhub-*.whl)
          (( ${#wheels[@]} == 1 ))
          /tmp/aiworkhub-release-smoke/bin/python -m pip install "${wheels[0]}"
          /tmp/aiworkhub-release-smoke/bin/python -c "import aiworkhub"
          /tmp/aiworkhub-release-smoke/bin/aiworkhub --help

      - name: Upload Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: aiworkhub-python-dist
          path: |
            dist/aiworkhub-*.whl
            dist/aiworkhub-*.tar.gz
          if-no-files-found: error

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Package VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Verify reproducible VSIX bytes
        run: |
          cp dist/aiworkhub-*.vsix /tmp/aiworkhub-first.vsix
          npm run package
          cmp /tmp/aiworkhub-first.vsix dist/aiworkhub-*.vsix
        working-directory: vscode-extension

      - name: Verify fresh VSIX manifest and package
        run: |
          shopt -s nullglob
          vsix=(vscode-extension/dist/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"
          python - "${vsix[0]}" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              assert "extension/package.json" in names
              manifest = json.loads(archive.read("extension/package.json"))
              assert manifest["name"] == "aiworkhub"
              assert any(name.startswith("extension/dist/") for name in names)
          PY

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: aiworkhub-vsix
          path: vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [provenance, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: aiworkhub-python-dist
          path: release-assets/python/
      - uses: actions/download-artifact@v8
        with:
          name: aiworkhub-vsix
          path: release-assets/vscode/
      - name: Verify release assets
        run: |
          shopt -s nullglob
          wheels=(release-assets/python/aiworkhub-*.whl)
          sdists=(release-assets/python/aiworkhub-*.tar.gz)
          vsix=(release-assets/vscode/aiworkhub-*.vsix)
          (( ${#wheels[@]} == 1 && ${#sdists[@]} == 1 && ${#vsix[@]} == 1 ))
          test -s "${wheels[0]}" && test -s "${sdists[0]}" && test -s "${vsix[0]}"
      - name: Generate release checksums
        run: >-
          python scripts/release_metadata.py checksums
          --output release-assets/SHA256SUMS
          release-assets/python/* release-assets/vscode/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.provenance.outputs.release_tag }}
          name: AIWorkHub ${{ needs.provenance.outputs.release_tag }}
          body: |
            ## AIWorkHub Release
            See the repository commit history for details.
            Verify downloaded artifacts against the attached `SHA256SUMS`.
          draft: false
          prerelease: ${{ contains(needs.provenance.outputs.release_tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/python/aiworkhub-*.whl
            release-assets/python/aiworkhub-*.tar.gz
            release-assets/vscode/aiworkhub-*.vsix
            release-assets/SHA256SUMS

  publish-open-vsx:
    name: Publish to Open VSX Registry
    if: vars.OVSX_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - name: Require Open VSX token
        run: test -n "$OVSX_TOKEN"
      - uses: actions/download-artifact@v8
        with:
          name: aiworkhub-vsix
          path: registry-assets/
      - name: Publish to Open VSX
        run: |
          shopt -s nullglob
          vsix=(registry-assets/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"
          npx --yes ovsx publish "${vsix[0]}" -p "$OVSX_TOKEN" --skip-duplicate

  publish-marketplace:
    name: Publish to VS Code Marketplace
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
    steps:
      - name: Require Marketplace token
        run: test -n "$MARKETPLACE_TOKEN"
      - uses: actions/download-artifact@v8
        with:
          name: aiworkhub-vsix
          path: registry-assets/
      - name: Publish to Marketplace
        run: |
          shopt -s nullglob
          vsix=(registry-assets/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"
          npx --yes @vscode/vsce publish --packagePath "${vsix[0]}" -p "$MARKETPLACE_TOKEN"

  publish-pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiworkhub/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aiworkhub-python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
