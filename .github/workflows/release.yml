# Tag-driven AIWorkHub release - Python distributions and VSIX
# Marketplace and Open VSX publication are optional, gated on
# explicit repository secrets (OVSX_TOKEN / MARKETPLACE_TOKEN).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<x.y.z> tag to release"
        required: true

permissions:
  contents: read

jobs:
  platform-qualification:
    name: Release qualification (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, mode: local }
          - { name: remote-ssh-contract, os: ubuntu-latest, mode: remote_ssh_contract }
          - { name: windows, os: windows-latest, mode: local }
          - { name: macos, os: macos-latest, mode: local }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical release metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/release_metadata.py check --tag "$RELEASE_TAG"

      - name: Install and qualify cross-platform Python runtime
        env:
          AIWORKHUB_QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install "pytest>=8,<10"
          python -m pytest tests/test_platform_io.py tests/test_cross_platform_runtime.py tests/test_release_qualification_e2e.py -q --tb=short --junitxml=qualification-${{ matrix.name }}.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package fresh VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ matrix.name }}
          path: |
            qualification-${{ matrix.name }}.xml
            vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error

  build:
    name: Build VSIX and Python package
    needs: [platform-qualification]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/release_metadata.py check --tag "$RELEASE_TAG"

      - name: Install Python test and build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          python -m pip install -e ".[dev]"

      - name: Run static quality gates
        run: |
          ruff check src/aiworkhub scripts tests
          mypy
          python scripts/check_public_docs.py

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short -x

      - name: Build Python distributions
        run: python -m build --outdir dist

      - name: Verify Python distributions
        run: |
          shopt -s nullglob
          wheels=(dist/aiworkhub-*.whl)
          sdists=(dist/aiworkhub-*.tar.gz)
          (( ${#wheels[@]} == 1 ))
          (( ${#sdists[@]} == 1 ))
          test -s "${wheels[0]}"
          test -s "${sdists[0]}"
          python -m twine check dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: aiworkhub-python-dist
          path: |
            dist/aiworkhub-*.whl
            dist/aiworkhub-*.tar.gz
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Verify reproducible VSIX bytes
        run: |
          cp dist/aiworkhub-*.vsix /tmp/aiworkhub-first.vsix
          npm run package
          cmp /tmp/aiworkhub-first.vsix dist/aiworkhub-*.vsix
        working-directory: vscode-extension

      - name: Verify VSIX
        run: |
          shopt -s nullglob
          vsix=(vscode-extension/dist/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworkhub-vsix
          path: vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: aiworkhub-python-dist
          path: release-assets/python/

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: aiworkhub-vsix
          path: release-assets/vscode/

      - name: Verify release assets
        run: |
          shopt -s nullglob
          wheels=(release-assets/python/aiworkhub-*.whl)
          sdists=(release-assets/python/aiworkhub-*.tar.gz)
          vsix=(release-assets/vscode/aiworkhub-*.vsix)
          (( ${#wheels[@]} == 1 ))
          (( ${#sdists[@]} == 1 ))
          (( ${#vsix[@]} == 1 ))
          test -s "${wheels[0]}"
          test -s "${sdists[0]}"
          test -s "${vsix[0]}"

      - name: Generate release checksums
        run: >-
          python scripts/release_metadata.py checksums
          --output release-assets/SHA256SUMS
          release-assets/python/* release-assets/vscode/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: AIWorkHub ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            ## AIWorkHub Release

            See the repository commit history for details.

            ### Installation

            ```bash
            # VS Code / Cursor / Windsurf
            code --install-extension aiworkhub-*.vsix

            # Remote-SSH: install on the remote host workspace
            ```

            Verify downloaded artifacts against the attached `SHA256SUMS`.
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/python/aiworkhub-*.whl
            release-assets/python/aiworkhub-*.tar.gz
            release-assets/vscode/aiworkhub-*.vsix
            release-assets/SHA256SUMS

  publish-open-vsx:
    name: Publish to Open VSX Registry
    if: vars.OVSX_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

    steps:
      - name: Require Open VSX token
        run: |
          test -n "$OVSX_TOKEN" || {
            echo "::error::OVSX_PUBLISH_ENABLED is true but OVSX_TOKEN is missing"
            exit 1
          }

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: aiworkhub-vsix
          path: registry-assets/

      - name: Publish to Open VSX
        run: |
          shopt -s nullglob
          vsix=(registry-assets/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"
          npx --yes ovsx publish "${vsix[0]}" -p "$OVSX_TOKEN" --skip-duplicate

  publish-marketplace:
    name: Publish to VS Code Marketplace
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    env:
      MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

    steps:
      - name: Require Marketplace token
        run: |
          test -n "$MARKETPLACE_TOKEN" || {
            echo "::error::MARKETPLACE_PUBLISH_ENABLED is true but MARKETPLACE_TOKEN is missing"
            exit 1
          }

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: aiworkhub-vsix
          path: registry-assets/

      - name: Publish to Marketplace
        run: |
          shopt -s nullglob
          vsix=(registry-assets/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"
          npx --yes @vscode/vsce publish --packagePath "${vsix[0]}" -p "$MARKETPLACE_TOKEN"

  publish-pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiworkhub/
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: aiworkhub-python-dist
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
