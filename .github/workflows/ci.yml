# CI for AIWorkHub — Python package + VS Code extension
# Pinned major action versions with least-privilege permissions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development quality tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff correctness gate
        run: ruff check src/aiworkhub scripts tests
      - name: Mypy typed-kernel gate
        run: mypy
      - name: Public documentation contract
        run: python scripts/check_public_docs.py
      - name: Recompute checked-in benchmark evidence
        run: |
          python scripts/check_semantic_edit_benchmark.py
          python scripts/check_context_envelope_benchmark.py
          python scripts/check_provider_routing_observation.py
          python scripts/check_retry_role_observation.py
          python scripts/check_system_benefit_snapshot.py
          python scripts/check_source_graph_slice_benchmark.py

  cross-platform:
    name: Fresh install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, mode: local, platform: linux }
          - { name: remote-ssh-contract, os: ubuntu-latest, mode: remote_ssh_contract, platform: linux }
          - { name: windows, os: windows-latest, mode: local, platform: windows }
          - { name: macos, os: macos-latest, mode: local, platform: macos }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify canonical release metadata
        run: python scripts/release_metadata.py check

      - name: Verify release assurance manifest
        run: python scripts/check_release_assurance.py

      - name: Verify replayable release evidence pack
        run: python scripts/check_release_evidence_pack.py

      - name: Install and qualify cross-platform Python runtime
        env:
          AIWORKHUB_QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[source-graph-semantic]"
          python -m pip install "pytest>=8,<10"
          python -m pytest tests/test_platform_io.py tests/test_cross_platform_runtime.py tests/test_release_qualification_e2e.py tests/test_quality_calibration.py tests/test_source_graph_tree_sitter_semantic.py -q --tb=short --junitxml=qualification-${{ matrix.name }}.xml

      - name: Run Windows-owned nt regressions (lock/process/temp/validation)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          AIWORKHUB_QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          WINDOWS_NT_MANIFEST=(
            tests/test_windows_launch_lock_regression.py
            tests/test_windows_pid_identity.py
            tests/test_windows_vscode_lm_launch_portability.py
            tests/test_terminal_authority_windows.py
            tests/test_completion_inbox_process_enrichment_windows_v1.py
            tests/test_completion_inbox_finalize_failed_windows_v3.py
            tests/test_aiworkhub_windows_secure_broker_b1464.py
            tests/test_runtime_temp.py
            tests/test_validation_pytest_runtime_b755_v1.py
            tests/test_validation_exec_scratch_b753_v1.py
            tests/test_validation_tmpdir_prefix_b773_v1.py
            tests/test_validation_cwd_prefix_b892.py
            tests/test_validation_executable_resolution_b1460.py
            tests/test_platform_io_blocking_lock.py
          )
          python - windows "${WINDOWS_NT_MANIFEST[@]}" <<'PY'
          import subprocess
          import sys

          platform, *manifest = sys.argv[1:]
          proc = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", *manifest],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  f"{platform} collection failed:\n{proc.stdout}\n{proc.stderr}"
              )
          collected = [
              line.strip() for line in proc.stdout.splitlines() if "::" in line
          ]
          if not collected:
              raise SystemExit(
                  f"{platform} collected zero platform-owned tests; "
                  "refusing to pass silently"
              )
          contributed = {line.split("::", 1)[0] for line in collected}
          missing = [path for path in manifest if path not in contributed]
          if missing:
              raise SystemExit(
                  f"{platform} manifest collected nothing for: {missing}"
              )
          print(
              f"{platform}: collected {len(collected)} tests across "
              f"{len(manifest)} manifest files"
          )
          PY
          python -m pytest "${WINDOWS_NT_MANIFEST[@]}" -q --tb=short --junitxml=qualification-${{ matrix.name }}-nt.xml

      - name: Run macOS-owned Darwin regressions (identity/launch/PATH/RSS/cleanup)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          AIWORKHUB_QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          MACOS_DARWIN_MANIFEST=(
            tests/test_process_launcher.py
            tests/test_aiworkhub_atomic_launch_lifecycle_b1462.py
            tests/test_validation_executable_resolution_b1460.py
            tests/test_evidence_instruments.py
            tests/test_finalized_workspace_gc_b512_v1.py
            tests/test_runtime_temp.py
            tests/test_validation_cwd_prefix_b892.py
          )
          python - macos "${MACOS_DARWIN_MANIFEST[@]}" <<'PY'
          import subprocess
          import sys

          platform, *manifest = sys.argv[1:]
          proc = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", *manifest],
              capture_output=True,
              text=True,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  f"{platform} collection failed:\n{proc.stdout}\n{proc.stderr}"
              )
          collected = [
              line.strip() for line in proc.stdout.splitlines() if "::" in line
          ]
          if not collected:
              raise SystemExit(
                  f"{platform} collected zero platform-owned tests; "
                  "refusing to pass silently"
              )
          contributed = {line.split("::", 1)[0] for line in collected}
          missing = [path for path in manifest if path not in contributed]
          if missing:
              raise SystemExit(
                  f"{platform} manifest collected nothing for: {missing}"
              )
          print(
              f"{platform}: collected {len(collected)} tests across "
              f"{len(manifest)} manifest files"
          )
          PY
          python -m pytest "${MACOS_DARWIN_MANIFEST[@]}" -q --tb=short --junitxml=qualification-${{ matrix.name }}-darwin.xml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package fresh VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: qualification-${{ matrix.name }}
          path: |
            qualification-${{ matrix.name }}.xml
            vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error

  python-ci:
    name: Python (3.12–3.14)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install "pytest>=8,<10"

      - name: Run Python tests
        run: |
          . .venv-ci/bin/activate
          python -m pytest tests/ -v --tb=short -x

  python-package:
    name: Python package
    needs: [python-ci, cross-platform, quality]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Verify Python distributions
        run: |
          shopt -s nullglob
          wheels=(dist/aiworkhub-*.whl)
          sdists=(dist/aiworkhub-*.tar.gz)
          (( ${#wheels[@]} == 1 ))
          (( ${#sdists[@]} == 1 ))
          test -s "${wheels[0]}"
          test -s "${sdists[0]}"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: aiworkhub-python-dist
          path: |
            dist/aiworkhub-*.whl
            dist/aiworkhub-*.tar.gz
          if-no-files-found: error

  vscode-ci:
    name: VS Code extension (test + package)
    needs: [cross-platform]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run static extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Verify reproducible VSIX bytes
        run: |
          cp dist/aiworkhub-*.vsix /tmp/aiworkhub-first.vsix
          npm run package
          cmp /tmp/aiworkhub-first.vsix dist/aiworkhub-*.vsix
        working-directory: vscode-extension

      - name: Verify VSIX
        run: |
          shopt -s nullglob
          vsix=(vscode-extension/dist/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: aiworkhub-vsix
          path: vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error
