# CI for AIWorkHub — Python package + VS Code extension
# Pinned major action versions with least-privilege permissions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Fresh install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, mode: local }
          - { name: remote-ssh-contract, os: ubuntu-latest, mode: remote_ssh_contract }
          - { name: windows, os: windows-latest, mode: local }
          - { name: macos, os: macos-latest, mode: local }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and qualify cross-platform Python runtime
        env:
          AIWORKHUB_QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install "pytest>=8,<10"
          python -m pytest tests/test_platform_io.py tests/test_cross_platform_runtime.py tests/test_release_qualification_e2e.py -q --tb=short --junitxml=qualification-${{ matrix.name }}.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install extension dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package fresh VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.name }}
          path: |
            qualification-${{ matrix.name }}.xml
            vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error

  python-ci:
    name: Python (3.10–3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install "pytest>=8,<10"

      - name: Run Python tests
        run: |
          . .venv-ci/bin/activate
          python -m pytest tests/ -v --tb=short -x

  python-package:
    name: Python package
    needs: [python-ci, cross-platform]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Verify Python distributions
        run: |
          shopt -s nullglob
          wheels=(dist/aiworkhub-*.whl)
          sdists=(dist/aiworkhub-*.tar.gz)
          (( ${#wheels[@]} == 1 ))
          (( ${#sdists[@]} == 1 ))
          test -s "${wheels[0]}"
          test -s "${sdists[0]}"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: aiworkhub-python-dist
          path: |
            dist/aiworkhub-*.whl
            dist/aiworkhub-*.tar.gz
          if-no-files-found: error

  vscode-ci:
    name: VS Code extension (test + package)
    needs: [cross-platform]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go for native Windows callback launchers
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install dependencies
        run: npm install
        working-directory: vscode-extension

      - name: Run static extension tests
        run: npm test
        working-directory: vscode-extension

      - name: Package VSIX
        run: npm run package
        working-directory: vscode-extension

      - name: Verify VSIX
        run: |
          shopt -s nullglob
          vsix=(vscode-extension/dist/aiworkhub-*.vsix)
          (( ${#vsix[@]} == 1 ))
          test -s "${vsix[0]}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiworkhub-vsix
          path: vscode-extension/dist/aiworkhub-*.vsix
          if-no-files-found: error
